<!doctype html>
<!-- ============================================================
     app.html — the Southwest Bowls phone app (served at /app).

     This is the screen the installed app opens on. It has no content
     of its own: everything comes from the same data files as the
     website, so publishing a tournament or a result updates both.

       events-data.json   Events tab, Home "Your next games" / "This week"
       results-data.json  Results tab, Home "Around the greens"
       app-home-data.json Home community story (photo, headline, champions)
       news-data.json     More → News
       streams-data.json  Watch tab (planned livestreams)
       clubs-data.json    More → Clubs; club ids for Follow club
       nav-data.json      More (the same menu as the website)
       content/<id>.json  More → information pages

     Code: assets/app/app.js · Styles: assets/app/app.css (brand tokens at the top).
     ============================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Southwest Bowls</title>
<meta name="description" content="Tournaments, results, livestreams and clubs from the Southwest Bowls Division of lawn bowls.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<script>
  /* Apply the saved appearance before the first paint (Light / Dark / System). */
  (function () {
    var pref = 'system';
    try { pref = JSON.parse(localStorage.getItem('swd:theme')) || 'system'; } catch (e) {}
    var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#231120' : '#ffffff');
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SW Bowls">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" href="/assets/icons/favicon-32.png" type="image/png">
<link rel="stylesheet" href="/assets/app/app.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<!-- No shared header: Home shows the logo; every other screen has its own compact heading. -->

<div class="netbar" id="netbar" role="status" aria-live="polite" hidden></div>

<main id="view" class="view" tabindex="-1">
  <div class="skel" role="status"><span class="sr-only">Loading…</span><span class="skel__h"></span><span class="skel__l"></span><span class="skel__b"></span><span class="skel__b"></span></div>
</main>

<nav class="tabbar" aria-label="Main">
  <a href="/app" data-tab="home">
    <span class="tabbar__sym"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></svg></span>
    <span>Home</span>
  </a>
  <a href="/app/events" data-tab="events">
    <span class="tabbar__sym"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18"/></svg></span>
    <span>Events</span>
  </a>
  <a href="/app/results" data-tab="results">
    <span class="tabbar__sym"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v6a4 4 0 0 1-8 0ZM8 5H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4M12 13v6m-4 2h8"/></svg></span>
    <span>Results</span>
  </a>
  <a href="/app/watch" data-tab="watch">
    <span class="tabbar__sym"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="3"/><path d="m10 8 5 3-5 3Zm-3 8h10"/></svg></span>
    <span>Watch</span>
  </a>
  <a href="/app/more" data-tab="more">
    <span class="tabbar__sym"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>
    <span>More</span>
  </a>
</nav>

<div class="sr-only" id="announce" role="status" aria-live="polite"></div>

<dialog class="dlg" id="dlg" aria-labelledby="dlg-title">
  <div id="dlg-body"></div>
  <button class="btn btn--ghost dlg__close" type="button" id="dlg-close">Close</button>
</dialog>

<noscript><p class="noscript">The Southwest Bowls app needs JavaScript. The full website is at <a href="/">swlawnbowls.org</a>.</p></noscript>
<script src="/assets/app/app-logic.js" defer></script>
<script src="/assets/app/app.js" defer></script>
</body>
</html>
