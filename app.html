<!doctype html>
<!-- ============================================================
     app.html — the Southwest Bowls phone app (served at /app).

     This is the screen the installed app opens on. It has no content
     of its own: everything comes from the same data files as the
     website, so publishing a tournament or a result updates both.

       events-data.json   Events tab, Home "Next tournament"
       results-data.json  Results tab, Home "Recent results"
       news-data.json     Home "News"
       streams-data.json  Watch tab (planned livestreams)
       clubs-data.json    More → Clubs
       nav-data.json      More (the same menu as the website)
       content/<id>.json  More → information pages

     Code: assets/app/app.js · Styles: assets/app/app.css (brand tokens at the top).
     ============================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Southwest Bowls</title>
<meta name="description" content="Tournaments, results, livestreams and clubs from the Southwest Bowls Division of lawn bowls.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SW Bowls">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" href="/assets/icons/favicon-32.png" type="image/png">
<link rel="stylesheet" href="/assets/app/app.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="topbar" id="topbar"></header>

<div class="netbar" id="netbar" role="status" aria-live="polite" hidden></div>

<main id="view" class="view" tabindex="-1" aria-live="polite">
  <div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Loading…</div>
</main>

<nav class="tabbar" aria-label="Main">
  <a href="/app" data-tab="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Home</span>
  </a>
  <a href="/app/events" data-tab="events">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
    <span>Events</span>
  </a>
  <a href="/app/results" data-tab="results">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>
    <span>Results</span>
  </a>
  <a href="/app/watch" data-tab="watch">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="13" rx="2.5"/><path d="m10 9 5 2.5-5 2.5z"/><path d="M8 21h8"/></svg>
    <span>Watch</span>
  </a>
  <a href="/app/more" data-tab="more">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    <span>More</span>
  </a>
</nav>

<noscript><p class="noscript">The Southwest Bowls app needs JavaScript. The full website is at <a href="/">swlawnbowls.org</a>.</p></noscript>
<script src="/assets/app/app.js" defer></script>
</body>
</html>
