<!doctype html>
<!-- ============================================================
     app.html — the Southwest Bowls phone app (served at /app).

     This is the screen the installed app opens on. It has no content
     of its own: everything comes from the same data files as the
     website, so publishing a tournament or a result updates both.

       events-data.json   Events tab, Home "Your next games" / "This week"
       results-data.json  Results tab, Home "Around the greens"
       app-home-data.json Home community story (photo, headline, champions)
       news-data.json     More → News
       streams-data.json  Watch tab (planned livestreams)
       clubs-data.json    More → Clubs; club ids for Follow club
       nav-data.json      More (the same menu as the website)
       content/<id>.json  More → information pages
       partners-data.json More → About Southwest: partners and affiliations

     Code: assets/app/app.js · Styles: assets/app/app.css (brand tokens at the top).
     ============================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Southwest Bowls</title>
<meta name="description" content="Tournaments, results, livestreams and clubs from the Southwest Bowls Division of lawn bowls.">
<meta name="theme-color" content="#f7f6f8">
<meta name="color-scheme" content="light dark">
<script>
  /* Apply the saved appearance before the first paint (Light / Dark / System). */
  (function () {
    var pref = 'system';
    try { pref = JSON.parse(localStorage.getItem('swd:theme')) || 'system'; } catch (e) {}
    var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#231120' : '#f7f6f8');
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SW Bowls">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" href="/assets/icons/favicon-32.png" type="image/png">
<link rel="stylesheet" href="/assets/app/app.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<!-- No shared header: Home shows the logo; every other screen has its own compact heading. -->

<div class="netbar" id="netbar" role="status" aria-live="polite" hidden></div>

<main id="view" class="view" tabindex="-1">
  <div class="skel" role="status"><span class="sr-only">Loading…</span><span class="skel__h"></span><span class="skel__l"></span><span class="skel__b"></span><span class="skel__b"></span></div>
</main>

<nav class="tabbar" aria-label="Main">
  <a href="/app" data-tab="home" aria-label="Home">
    <span class="tabbar__sym"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /> <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg></span>
    <span>Home</span>
  </a>
  <a href="/app/events" data-tab="events" aria-label="Events">
    <span class="tabbar__sym"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4" /> <path d="M16 2v4" /> <rect width="18" height="18" x="3" y="4" rx="2" /> <path d="M3 10h18" /></svg></span>
    <span>Events</span>
  </a>
  <a href="/app/results" data-tab="results" aria-label="Results">
    <span class="tabbar__sym"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /> <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /> <path d="M4 22h16" /> <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /> <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /> <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /></svg></span>
    <span>Results</span>
  </a>
  <a href="/app/my" data-tab="my" aria-label="My SWD">
    <span class="tabbar__sym"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /> <circle cx="12" cy="7" r="4" /></svg></span>
    <span>My SWD</span>
  </a>
  <a href="/app/more" data-tab="more" aria-label="More">
    <span class="tabbar__sym"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1" /> <circle cx="19" cy="12" r="1" /> <circle cx="5" cy="12" r="1" /></svg></span>
    <span>More</span>
  </a>
</nav>

<div class="sr-only" id="announce" role="status" aria-live="polite"></div>

<dialog class="dlg" id="dlg" aria-labelledby="dlg-title">
  <div id="dlg-body"></div>
  <button class="btn btn--ghost dlg__close" type="button" id="dlg-close">Close</button>
</dialog>

<noscript><p class="noscript">The Southwest Bowls app needs JavaScript. The full website is at <a href="/">swlawnbowls.org</a>.</p></noscript>
<script src="/assets/app/app-logic.js" defer></script>
<script src="/assets/app/app.js" defer></script>
</body>
</html>
