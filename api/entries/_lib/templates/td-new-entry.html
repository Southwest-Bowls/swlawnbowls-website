<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{subject}}</title></head>
<body style="margin:0;padding:0;background:#f6f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#231120;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f5f7;padding:24px 12px;"><tr><td align="center">
 <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:18px;border:1px solid #e4dfe3;">
  <tr><td style="padding:24px 28px 8px;">
    <div style="font-size:18px;font-weight:800;">Southwest Bowls Division</div>
    <h1 style="margin:14px 0 6px;font-size:24px;line-height:1.2;">{{heading}}</h1>
    <p style="margin:0 0 16px;font-size:16px;line-height:1.5;color:#635861;">{{intro_line}}</p>
  </td></tr>
  <tr><td style="padding:0 28px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #e4dfe3;font-size:15px;line-height:1.45;">
      <tr><td style="padding:10px 0;color:#635861;width:130px;">Event</td><td style="padding:10px 0;font-weight:700;">{{event_title}}</td></tr>
      <tr><td style="padding:10px 0;color:#635861;border-top:1px solid #e4dfe3;">Entry</td><td style="padding:10px 0;font-weight:700;border-top:1px solid #e4dfe3;">{{team_lines}}</td></tr>
      <tr><td style="padding:10px 0;color:#635861;border-top:1px solid #e4dfe3;">Submitted by</td><td style="padding:10px 0;font-weight:700;border-top:1px solid #e4dfe3;">{{contact_name}}, {{contact_email}}</td></tr>
      <tr><td style="padding:10px 0;color:#635861;border-top:1px solid #e4dfe3;">Amount</td><td style="padding:10px 0;font-weight:700;border-top:1px solid #e4dfe3;">{{fee}}</td></tr>
      <tr><td style="padding:10px 0;color:#635861;border-top:1px solid #e4dfe3;">Payment</td><td style="padding:10px 0;font-weight:700;border-top:1px solid #e4dfe3;">{{payment_line}}</td></tr>
      <tr><td style="padding:10px 0;color:#635861;border-top:1px solid #e4dfe3;">Entry number</td><td style="padding:10px 0;font-weight:700;border-top:1px solid #e4dfe3;">{{entry_id}}</td></tr>
    </table>
  </td></tr>
  <tr><td style="padding:16px 28px 26px;font-size:15px;line-height:1.5;">{{action_line}}</td></tr>
 </table>
</td></tr></table>
</body></html>
