<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Southwest Bowls</title>
<meta name="theme-color" content="#1a365d">
<style>
  :root { --ink: #172033; --soft: #4a5568; --navy: #1a365d; --bg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eef2f7; --soft: #b6c0cf; --navy: #8fb3e8; --bg: #0f1724; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: var(--bg); color: var(--ink);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 26rem; padding: 2rem 16px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 20px; }
  h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; color: var(--navy); }
  p { color: var(--soft); margin: 0 0 1.25rem; }
  button { font: inherit; padding: .7rem 1.4rem; border: 0; border-radius: 999px;
           background: #1a365d; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/assets/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>This page hasn't been saved on your phone yet. Pages you've opened before
     still work without a signal. Try again when you're back in range.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
